plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

def getGitCommitCount = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim().toInteger()
    } catch (ignored) {
        return 1
    }
}

android {
    namespace 'com.p2petrovich.telegramnewsreader'
    compileSdk 34

    lint {
        checkReleaseBuilds true
        abortOnError true
        ignoreWarnings false
        fatal 'StopShip'
        textReport true
        textOutput file('lint-report.txt')
    }

    defaultConfig {
        applicationId = "com.p2petrovich.telegramnewsreader"
        minSdk 24
        targetSdk 34

        def commitCount = getGitCommitCount()
        versionCode commitCount
        versionName "3.0.${commitCount}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        splits {
            abi {
                enable true
                reset()
                include "arm64-v8a"
                universalApk false
            }
        }

        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localProperties.load(localPropertiesFile.newDataInputStream())
        }

        def telegramApiId = System.getenv("TELEGRAM_API_ID") ?: localProperties.getProperty("telegram.api.id", "0")
        def telegramApiHash = System.getenv("TELEGRAM_API_HASH") ?: localProperties.getProperty("telegram.api.hash", "")

        // AI API-ключи (OpenRouter, Groq) вынесены из BuildConfig в EncryptedSharedPreferences.
        // Пользователь вводит их вручную в диалоге AI-настроек — в APK они не попадают.

        buildConfigField "Integer", "TELEGRAM_API_ID", telegramApiId
        buildConfigField "String", "TELEGRAM_API_HASH", "\"${telegramApiHash}\""

        manifestPlaceholders = [appName: "News Reader"]
    }

    signingConfigs {
        release {
            // Параметры берутся из env-переменных CI (GitHub Secrets).
            // Локально переменные не установлены — для локальной release-сборки
            // добавь их в Run/Debug Configurations → Environment variables.
            storeFile     file(System.getenv("KEYSTORE_PATH")     ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")      ?: ""
            keyAlias      System.getenv("KEY_ALIAS")              ?: ""
            keyPassword   System.getenv("KEY_PASSWORD")           ?: ""
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            manifestPlaceholders = [appName: "News Reader (Debug)"]
        }
        release {
            // [FIX] P0-2: включены минификация и удаление неиспользуемых ресурсов.
            // Требует наличия app/proguard-rules.pro с keep-правилами для TDLib/Room/Gson.
            // [FFmpeg removed] Keep-правила для com.arthenica.** больше не нужны —
            // FFmpeg-kit удалён из зависимостей (см. секцию dependencies ниже).
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.getByName("release")
            manifestPlaceholders = [appName: "News Reader"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // Откат P3-13: Java 8. Java 17 запускала JdkImageTransform/jlink, что падало
        // на core-for-system-modules.jar в этом окружении. На Java 8 transform не вызывается.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Security
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.10.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // TDLib
    implementation files('libs/tdlib-android.aar')

    // [FFmpeg removed] FFmpeg-kit удалён из проекта.
    // Раньше здесь были:
    //   implementation(files("libs/ffmpeg-kit-full-gpl-6.0-2.LTS.aar"))
    //   implementation("com.arthenica:smart-exception-java:0.2.1")
    // Причины удаления:
    //   1) Лицензия: GPLv3-сборка FFmpeg несовместима с PolyForm Noncommercial.
    //   2) ffmpeg-kit архивирован автором — бинарники постепенно недоступны.
    //   3) −73 МБ в APK и репозитории.
    // Весь аудио-пайплайн переведён на нативную (чистый Kotlin) обработку WAV:
    //   - Edge TTS запрашивается как raw-24khz-16bit-mono-pcm (без MP3-декода);
    //   - выход Android System TTS нормализуется через utils/PcmResampler;
    //   - склейка глав делается в utils/AudioUtils без перекодирования.
    // Также удалите файл app/libs/ffmpeg-kit-full-gpl-6.0-2.LTS.aar вручную.

    // Image loading
    implementation "io.coil-kt:coil:2.6.0"

    // Date/Time backport
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.6'
}
