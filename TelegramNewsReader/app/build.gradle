plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs.kotlin'
    id 'kotlin-parcelize'
    }

android {
    namespace 'com.example.telegramnewsreader'
    compileSdk 34

    defaultConfig {
        applicationId = "com.example.telegramnewsreader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

// 🔐 Безопасное чтение API ID и Hash из local.properties или окружения
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file("local.properties")
    if (localPropertiesFile.exists()) {
        localProperties.load(localPropertiesFile.newDataInputStream())
    }

    def telegramApiId = System.getenv("TELEGRAM_API_ID") ?: localProperties.getProperty("telegram.api.id", "0")
    def telegramApiHash = System.getenv("TELEGRAM_API_HASH") ?: localProperties.getProperty("telegram.api.hash", "")

    buildConfigField "Integer", "TELEGRAM_API_ID", telegramApiId
    buildConfigField "String", "TELEGRAM_API_HASH", "\"${telegramApiHash}\""
}
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.code.gson:gson:2.10.1' // JSON
    implementation 'androidx.security:security-crypto:1.1.0-alpha06' // EncryptedSharedPreferences
    //implementation 'com.github.hiteshsondhi88.libffmpeg:FFmpegAndroid:0.3.2' // Для MP3-сжатия в TTSManager
    //implementation 'com.github.hiteshsondhi88:libffmpeg:0.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.10.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    //implementation(name: 'tdlib-android', ext: 'aar')
    implementation files('libs/FFmpegAndroid-0.3.2.aar')
    implementation files('libs/tdlib-android.aar')
    implementation(files("libs/ffmpeg-kit-full-gpl-6.0-2.LTS.aar"))
  //  implementation 'com.arthenica:ffmpeg-kit-full-gpl:6.0'
    implementation("com.arthenica:smart-exception-java:0.2.1")
    implementation "io.coil-kt:coil:2.6.0"
}
