name: Release

# Срабатывает при пуше тега вида v3.0.NNN
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # обязательно для softprops/action-gh-release

    steps:
      # ── 1. Полная история — иначе git rev-list --count HEAD вернёт 1
      #       и versionCode в APK будет равен 1.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. JDK 17 — исполняющая среда Gradle.
      #       Байткод проекта остаётся VERSION_1_8 (kotlinOptions.jvmTarget = '1.8'),
      #       так что jlink/JdkImageTransform не вызываются.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Gradle с кэшем — ускоряет повторные сборки
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 4. Декодируем keystore из base64-секрета
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d \
            > TelegramNewsReader/app/release.jks

      # ── 5. Сборка подписанного APK
      #       OPENROUTER_API_KEY и GROQ_API_KEY намеренно НЕ передаются —
      #       release-APK работает только на ключе, введённом пользователем.
      #       TELEGRAM_API_ID/HASH: если нужны для CI, добавь их в Secrets.
      - name: Build signed APK
        working-directory: TelegramNewsReader
        env:
          KEYSTORE_PATH:     release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 6. Публикуем Release на GitHub
      #       glob берёт arm64-APK + mapping.txt (если есть)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TelegramNewsReader/app/build/outputs/apk/release/*arm64*.apk
            TelegramNewsReader/app/build/outputs/mapping/release/mapping.txt
